# MNCs tracked for Malaysian tech internships.
#
# Every company is matched against job-portal results (JobStreet, LinkedIn)
# by `name` + `aliases`. Companies with an `[company.ats]` table are also
# fetched directly from their own career site every run.
#
# type: tech | consulting | semicon | gbs | malaysian
#
# ATS kinds and their fields:
#   workday          host, tenant, site (or sites = [...])
#   greenhouse       board
#   lever            site, region = "eu" (optional)
#   smartrecruiters  id
#   oracle           host, site
#   successfactors   base_url
#   eightfold        host, domain
#   amazon           (no fields)
#
# The ATS details were filled in from public career-site URLs and have NOT all
# been verified yet: check the "Sources" panel on the site after the first run
# and fix or set `enabled = false` on any that fail.
#
# To add a company: copy a block, set name/type/aliases/careers, and (if you
# know it) the ATS. Find the ATS by opening the company's job search page and
# looking at the URL (myworkdayjobs.com, smartrecruiters.com, ...).

# ============================================================== Tech

