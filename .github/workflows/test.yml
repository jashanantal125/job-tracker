name: Tests

on:
  push:
    paths: ["scraper/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["scraper/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: scraper
        run: python3 -m unittest discover -s tests -t . -v
